<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Number Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="number-display" id="numberDisplay"></div>
        <button class="button" id="generateButton">Generate a number (0-99)</button>
        <div class="notification" id="notification">Your number is chosen, sending to Telegram...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
